<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>{{ editing ? 'Edit Resident' : 'Add Resident' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button strong (click)="save()">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-heading">Family</div>
  <ion-select class="field" fill="outline" label="Family / household" labelPlacement="stacked"
              [disabled]="familyLocked" [(ngModel)]="form.familyId">
    @for (f of health.sortedFamilies(); track f.id) {
      <ion-select-option [value]="f.id">{{ f.householdNo }} · {{ health.headName(f.id) }}</ion-select-option>
    }
  </ion-select>
  <ion-select class="field" fill="outline" label="Relation to head" labelPlacement="stacked" [(ngModel)]="form.relation">
    @for (r of relations; track r) { <ion-select-option [value]="r">{{ r }}</ion-select-option> }
  </ion-select>

  <div class="form-heading">Personal details</div>
  <ion-input class="field" fill="outline" label="First name" labelPlacement="stacked" [(ngModel)]="form.firstName"></ion-input>
  <ion-input class="field" fill="outline" label="Last name" labelPlacement="stacked" [(ngModel)]="form.lastName"></ion-input>
  <ion-input class="field" fill="outline" label="Date of birth" labelPlacement="stacked" type="date" [max]="today" [(ngModel)]="form.birthDate"></ion-input>
  <ion-select class="field" fill="outline" label="Gender" labelPlacement="stacked" [(ngModel)]="form.gender">
    @for (g of genders; track g) { <ion-select-option [value]="g">{{ g }}</ion-select-option> }
  </ion-select>

  <div class="form-heading">Contact &amp; PhilHealth</div>
  <ion-input class="field" fill="outline" label="Contact number" labelPlacement="stacked" type="tel" inputmode="tel" [(ngModel)]="form.contactNumber"></ion-input>
  <ion-input class="field" fill="outline" label="PhilHealth number" labelPlacement="stacked" inputmode="numeric" [(ngModel)]="form.philhealthNo"></ion-input>
</ion-content>
