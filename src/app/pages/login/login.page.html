<ion-content class="app">
  <div class="login-wrap">
    <div class="brand">
      <span class="logo"><ion-icon name="medkit"></ion-icon></span>
      <h1>CHIA</h1>
      <p>Community Health Information Application</p>
    </div>

    <form class="card form" (submit)="$event.preventDefault(); login()">
      <ion-input class="field" fill="outline" label="Username" labelPlacement="stacked" autocomplete="username"
                 autocapitalize="off" [(ngModel)]="username" name="username"></ion-input>
      <ion-input class="field" fill="outline" label="Password" labelPlacement="stacked" type="password"
                 autocomplete="current-password" [(ngModel)]="password" name="password"></ion-input>
      <ion-checkbox labelPlacement="end" [(ngModel)]="remember" name="remember">Remember me</ion-checkbox>
      <ion-button expand="block" type="submit" [disabled]="busy">Log in</ion-button>
      <ion-button expand="block" fill="clear" size="small" type="button" (click)="forgot()">Forgot password?</ion-button>
    </form>

    <div class="card demo">
      <div class="eyebrow-label">Demo accounts</div>
      <p class="muted small">bhw / bhw123 &middot; nurse / nurse123 &middot; admin / admin123</p>
    </div>
  </div>
</ion-content>
