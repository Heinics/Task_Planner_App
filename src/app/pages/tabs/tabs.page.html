<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="families">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Families</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="residents">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Residents</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="reports">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <ion-label>Reports</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="sync">
      <ion-icon name="sync-outline"></ion-icon>
      <ion-label>Sync</ion-label>
      @if (health.queue().length) { <ion-badge color="warning">{{ health.queue().length }}</ion-badge> }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
